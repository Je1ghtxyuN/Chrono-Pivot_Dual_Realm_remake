<header><h1>晷枢双界 / UI 预览</h1><p>青绿、象牙白与黄铜色。以下为 Unity 中运行的原生 UI，包含桌面与世界空间 VR 界面。点击图片可查看原图。</p><p>鼠标：Esc 菜单 · Tab 任务。VR：右 B / 菜单键打开菜单，左右扳机点击与拖动。</p></header>
<main>

<figure><a href="02_Tasks.png"><img src="02_Tasks.png"></a><figcaption><strong>02 当前任务</strong><small>读取真实目标、线索与步骤；提示不会跳过物理实验。</small></figcaption></figure>

<figure><a href="04_Settings.png"><img src="04_Settings.png"></a><figcaption><strong>04 设置</strong><small>实际控制音量、行走速度、转向和鼠标灵敏度。</small></figcaption></figure>
<figure><a href="05_Controls.png"><img src="05_Controls.png"></a><figcaption><strong>05 操作指南</strong><small>随键鼠 / VR 模式切换。</small></figcaption></figure>
<figure><a href="06_Desktop_HUD.png"><img src="06_Desktop_HUD.png"></a><figcaption><strong>06 桌面 HUD</strong><small>任务、准星、实验反馈与交互操作提示。</small></figcaption></figure>
