<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>物理导师 · 实验原型</title><style>
:root{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#183047;background:#f3f6f8}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:32px auto;padding:0 22px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{margin:0;font-size:26px}.sub{color:#597080;font-size:14px}.tag{border:1px solid #c9dce4;background:#edf5f7;padding:7px 12px;border-radius:20px;font-size:13px}.grid{display:grid;grid-template-columns:1.05fr 1fr;gap:22px;margin-top:24px}.panel{background:white;border:1px solid #dae4e9;border-radius:14px;padding:24px;box-shadow:0 3px 16px #18304707}h2{font-size:17px;margin:0 0 18px}label{display:block;font-size:14px;font-weight:600;margin:18px 0 8px}textarea,select{width:100%;border:1px solid #bbccd6;border-radius:8px;padding:11px;font:inherit;color:#183047;background:white}textarea{resize:vertical;min-height:125px}#state{min-height:76px}.row{display:flex;gap:12px}.row>div{flex:1}button{font:inherit;border:0;border-radius:8px;padding:11px 17px;background:#246c83;color:white;cursor:pointer}.secondary{background:#e9f0f3;color:#315267}button:disabled{opacity:.55;cursor:wait}.actions{display:flex;gap:12px;margin-top:20px}.answer{white-space:pre-wrap;line-height:1.8;font-size:16px;min-height:130px}.muted{color:#6b7e8c}.meta{font-size:12px;color:#6b7e8c;border-top:1px solid #e3eaee;margin-top:18px;padding-top:12px}.source{padding:12px 0;border-bottom:1px solid #edf1f4;font-size:13px;line-height:1.7}.source a{color:#246c83}.history{margin-top:22px;font-size:14px;line-height:1.8}.history p{border-left:3px solid #c9dce4;padding:8px 12px;margin:8px 0;white-space:pre-wrap}.error{color:#a43a34}.note{font-size:12px;color:#6b7e8c;line-height:1.7;margin-top:20px}@media(max-width:780px){.grid{grid-template-columns:1fr}main{margin:20px auto}.top{align-items:flex-start}.tag{max-width:180px}}
</style></head><body><main><div class="top"><div><h1>物理导师</h1><p class="sub">从观察、理解原理，到自己完成检查</p></div><span id="health" class="tag">正在检查模型连接</span></div><div class="grid"><section class="panel"><h2>你的问题与实验观察</h2><label for="question">问题</label><textarea id="question" placeholder="例如：我把还没滑动的盒子的摩擦力直接算成了 μsN，应该先检查什么？"></textarea><label for="state">你的想法或观察（选填）</label><textarea id="state" placeholder="说明已知条件、你的计算或玩家操作，不需要提供完整答案。"></textarea><div class="row"><div><label for="mode">学习方式</label><select id="mode"><option value="teach">引导我自己解决</option><option value="concept">解释物理概念</option><option value="solve">计算物理量</option></select></div><div><label for="level">提示深度</label><select id="level"><option value="1">1 · 先观察</option><option value="2">2 · 理解原理</option><option value="3">3 · 分步检查</option></select></div></div><div class="actions"><button id="send">向导师提问</button><button id="reset" class="secondary">开启新对话</button></div><p class="note">适用范围：入门力学、流体、振动与波、热学、电路和几何光学。知识卡提供固定版本教材来源；本原型尚未经物理教师专家审核。</p></section><section class="panel"><h2>导师的引导</h2><div id="answer" class="answer muted">提交问题后，这里显示模型的实际回答。</div><div id="meta" class="meta">尚无请求结果</div><h2 style="margin-top:24px">本次检索的知识来源</h2><div id="sources" class="muted">尚无检索结果</div></section></div><section class="history panel"><h2>实际对话记录</h2><div id="history" class="muted">新对话</div></section></main><script>
const el=id=>document.getElementById(id);let history=[];const paragraph=(prefix,text)=>{const p=document.createElement('p');p.textContent=prefix+text;return p;};
function redraw(){el('history').replaceChildren(...history.map(x=>paragraph(x.role==='user'?'你：':'导师：',x.content)));}
el('reset').onclick=()=>{history=[];redraw();el('answer').textContent='新对话已开启。';el('meta').textContent='尚无请求结果';el('sources').textContent='尚无检索结果';el('level').value='1';};
el('send').onclick=async()=>{const q=el('question').value.trim();if(!q){el('answer').textContent='请先输入问题。';return;}el('send').disabled=true;el('answer').className='answer muted';el('answer').textContent='导师正在核对条件与知识来源…';try{const req={question:q,mode:el('mode').value,hint_level:Number(el('level').value),student_state:{description:el('state').value.trim()},history};const res=await fetch('/api/tutor',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(req)});const data=await res.json();if(!res.ok||!data.ok)throw new Error(data.error||'本次模型回答未通过核验');el('answer').className='answer';el('answer').textContent=data.answer.reply;el('meta').textContent=`实际响应 ${(data.response_seconds||0).toFixed(2)} 秒 · ${data.answer.status} · 引用 ${(data.answer.evidence_ids||[]).join('、')||'未引用知识卡'}`;el('sources').replaceChildren();for(const c of data.evidence||[]){const div=document.createElement('div');div.className='source';const a=document.createElement('a');a.textContent=c.title+' · 章节 '+c.source_section;a.href=c.source_url;a.target='_blank';a.rel='noopener';div.append(a);const excerpt=document.createElement('div');excerpt.textContent=c.text||'';div.append(excerpt);const info=document.createElement('div');info.textContent=c.id+' · '+c.source_revision;div.append(info);const attr=document.createElement('div');attr.textContent=c.attribution;div.append(attr);el('sources').append(div);}if(!(data.evidence||[]).length)el('sources').textContent='未检索到相关知识卡；模型不得伪造来源。';history.push({role:'user',content:q+(req.student_state.description?'\n我的观察：'+req.student_state.description:'')},{role:'assistant',content:data.answer.reply});if(history.length>20)history=history.slice(-20);redraw();el('state').value='';}catch(e){el('answer').className='answer error';el('answer').textContent=e.message;el('meta').textContent='本次请求失败，不计作成功回答。';}finally{el('send').disabled=false;}};
fetch('/health').then(r=>r.json()).then(d=>{el('health').textContent=d.ready?'模型已连接 · 基本原型':'模型尚未就绪';}).catch(()=>{el('health').textContent='模型未连接';});
</script></body></html>
